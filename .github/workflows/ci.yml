name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate content
        run: npm run content:validate

      - name: Compile content
        run: npm run content:compile

      - name: Verify generated content
        run: npm run content:verify-generated

      - name: Verify architecture and templates
        run: npm run architecture:audit && npm run content:templates

      - name: Run unit and integration tests
        run: npm run test

      - name: Run browser tests
        run: npm run test:e2e

      - name: Build application
        run: npm run build

      - name: Build release candidate
        run: npm run release:build

      - name: Verify release candidate
        run: npm run release:verify

      - name: Verify repository contract
        run: npm run verify

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
